name: Rebuild paper PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - 'paper/*.tex'
      - 'tools/restyle.py'
      - 'tools/tex2md.py'
      - '.github/workflows/paper-rebuild.yml'
      - 'tools/install_tectonic_conda.py'
      - 'tools/tectonic-conda-lock.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize the Chinese article layout
        run: python3 tools/restyle.py paper/nonalgebra_zh.tex

      - name: Normalize the English source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("paper/nonalgebra_en.tex")
          source = path.read_text()
          lines = []
          seen = False
          for line in source.splitlines(keepends=True):
              if re.fullmatch(r"\s*\\usepackage\{amsthm\}\s*", line):
                  if seen:
                      continue
                  seen = True
              lines.append(line)
          source = "".join(lines)
          if not seen:
              marker = r"\usepackage{unicode-math}"
              if marker not in source:
                  raise SystemExit("Expected unicode-math marker is missing")
              source = source.replace(marker, marker + "\n" + r"\usepackage{amsthm}", 1)
          source = source.replace(r"$\square$", r"\qed")
          path.write_text(source)
          PY

      - name: Generate the readable Markdown from the English source
        run: python3 tools/tex2md.py paper/nonalgebra_en.tex paper/nonalgebra_en.md

      # Digest published beside this asset on the official Tectonic release page.
      - name: Restore verified Tectonic archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/paper-tectonic
          key: tectonic-${{ runner.os }}-${{ runner.arch }}-0.17.0-1a715688baf591e650c8aeb160ae934e181685eecbb38b317de30b269ac5d606

      - name: Install tectonic
        id: primary_tectonic
        continue-on-error: true
        env:
          TECTONIC_SHA256: 1a715688baf591e650c8aeb160ae934e181685eecbb38b317de30b269ac5d606
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          cache="$HOME/.cache/paper-tectonic"
          archive="$cache/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$cache" "$HOME/.local/bin"
          # Never execute a cached archive without checking it.
          if ! echo "$TECTONIC_SHA256  $archive" | sha256sum --check --status; then
            curl --proto '=https' --tlsv1.2 --fail --location --show-error \
              --retry 4 --retry-delay 5 --retry-max-time 180 \
              --connect-timeout 15 --max-time 60 \
              'https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz' \
              --output "$archive.part"
            echo "$TECTONIC_SHA256  $archive.part" | sha256sum --check --status
            mv "$archive.part" "$archive"
          fi
          echo "$TECTONIC_SHA256  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$HOME/.local/bin" tectonic
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/tectonic" --version

      - name: Restore locked conda-forge packages
        if: steps.primary_tectonic.outcome == 'failure'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/paper-tectonic-conda
          key: tectonic-conda-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/tectonic-conda-lock.json') }}

      - name: Install locked conda-forge fallback
        if: steps.primary_tectonic.outcome == 'failure'
        run: python3 tools/install_tectonic_conda.py tools/tectonic-conda-lock.json

      - name: Compile every paper source
        run: |
          mkdir -p build
          for src in paper/*.tex; do
            base=$(basename "$src" .tex)
            cp "$src" "build/$base.tex"
            ( cd build && tectonic -X compile "$base.tex" --outdir . )
            cp "build/$base.pdf" "paper/$base.pdf"
          done
          ls -l paper/*.pdf

      - name: Commit the result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/*.tex paper/*.pdf paper/nonalgebra_en.md
          git commit -m 'Rebuild paper artefacts' || echo 'nothing to commit'
          git push
